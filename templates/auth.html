{% extends 'base.html' %}{% block content %}<div class="auth card"><h1>{{'Create your GreenRoute account' if register else 'Welcome back'}}</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">{% if register %}<label>Name<input name="name" required></label><label>Department<input name="department" value="CSE" required></label><label>Year<select name="year"><option>1st</option><option>2nd</option><option>3rd</option><option>4th</option></select></label><label>Home area<input name="home_area" value="Gomti Nagar"></label>{% endif %}<label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" required></label><button class="btn primary" type="submit">{{'Create account' if register else 'Login'}}</button></form><p>{% if register %}Already registered? <a href="/login">Login</a>{% else %}New here? <a href="/register">Create an account</a>{% endif %}</p></div>{% endblock %}
