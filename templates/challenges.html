{% extends 'base.html' %}{% block content %}<div class="pagehead"><div><span class="pill">CHALLENGES</span><h1>Small actions, campus-scale impact.</h1></div></div><div class="grid two">{% for c in challenges %}<article class="card"><h2>{{c.title}}</h2><p>{{c.description}}</p><div class="progress"><i style="width:{{[saved/c.target*100,100]|min}}%"></i></div><p>{{'%.1f'|format([saved,c.target]|min)}} / {{c.target}} · 🎁 {{c.reward_points}} points</p></article>{% endfor %}</div>{% endblock %}
